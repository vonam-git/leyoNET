# Hält die Werkzeuge aktuell: npm (nur Build- und Testwerkzeuge, die App hat keine Laufzeitabhängigkeiten),
# Rust-Pakete der Desktop-App und die GitHub-Actions (auf Commit gepinnt, Dependabot führt die Kennung nach).
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    target-branch: develop
    schedule:
      interval: weekly
    groups:
      werkzeuge:
        patterns: ['*']
    open-pull-requests-limit: 3
  - package-ecosystem: cargo
    directory: /src-tauri
    target-branch: develop
    schedule:
      interval: weekly
    groups:
      rust:
        patterns: ['*']
    open-pull-requests-limit: 3
  - package-ecosystem: github-actions
    directory: /
    target-branch: develop
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
