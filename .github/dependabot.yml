# Hält die Werkzeuge aktuell: npm (nur Build- und Testwerkzeuge, die App hat keine Laufzeitabhängigkeiten),
# Rust-Pakete der Desktop-App und die GitHub-Actions (auf Commit gepinnt, Dependabot führt die Kennung nach).
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    target-branch: develop
    schedule:
      interval: weekly
    groups:
      werkzeuge:
        patterns: ['*']
    # Grosse Versionssprünge (z.B. TypeScript 7, Vitest 5) bewusst von Hand: Sie brechen oft
    # Abhängigkeiten (svelte-check verlangt TypeScript 5 oder 6) und brauchen Anpassungen am Code.
    ignore:
      - dependency-name: '*'
        update-types: ['version-update:semver-major']
    open-pull-requests-limit: 3
  - package-ecosystem: cargo
    directory: /src-tauri
    target-branch: develop
    schedule:
      interval: weekly
    groups:
      rust:
        patterns: ['*']
    ignore:
      - dependency-name: '*'
        update-types: ['version-update:semver-major']
    open-pull-requests-limit: 3
  - package-ecosystem: github-actions
    directory: /
    target-branch: develop
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
